<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡拉OK歌词工作室</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <b class="brand" data-i18n="app.name">卡拉OK歌词工作室</b>
    <input id="title" type="text" data-i18n-title="top.title" data-i18n-placeholder="top.title" spellcheck="false">
    <span class="grp">
      <button id="bNew" data-i18n="top.new" data-i18n-title="top.newTip">新建</button>
      <button id="bOpen" data-i18n="top.open" data-i18n-title="top.openTip">打开…</button>
      <button id="bSave" class="pri" data-i18n="top.save" data-i18n-title="top.saveTip">保存</button>
      <button id="bSaveAs" data-i18n="top.saveAs" data-i18n-title="top.saveAsTip">另存为…</button>
    </span>
    <span class="grp">
      <button id="bImport" data-i18n="top.import" data-i18n-title="top.importTip">导入 SRT / JSON…</button>
      <select id="samples" data-i18n-title="top.samplesTip"><option value="" data-i18n="top.samples">示例…</option></select>
      <button id="bMedia" data-i18n="top.media" data-i18n-title="top.mediaTip">载入音视频…</button>
      <span id="mediaName" class="hint" data-i18n="top.noMedia">未载入音视频</span>
    </span>
    <span class="grp right">
      <button id="bUndo" data-i18n="top.undo" data-i18n-title="top.undoTip">↶ 撤销</button><button id="bRedo" data-i18n="top.redo" data-i18n-title="top.redoTip">↷ 重做</button>
      <button id="bRec" data-i18n="top.rec" data-i18n-title="top.recTip">录屏模式</button>
      <select id="lang" data-i18n-title="top.langTip"></select>
    </span>
  </header>

  <aside id="left">
    <h3><span data-i18n="left.title">歌词行</span><button id="bAdd" data-i18n="left.add" data-i18n-title="left.addTip">＋ 添加</button></h3>
    <div id="list"></div>
  </aside>

  <main id="center">
    <div id="stageBox"><canvas id="cv" width="1920" height="1080"></canvas></div>
    <div id="bar">
      <button id="bPlay" class="pri" data-i18n-title="bar.playTip">▶</button>
      <span id="tm">0:00.00 / 0:00.00</span>
      <span class="seg" id="tool" data-i18n-title="bar.toolTip">
        <button data-v="retime" class="on" data-i18n="bar.retime" data-i18n-title="bar.retimeTip">拖光标：校时</button><button data-v="scrub" data-i18n="bar.scrub" data-i18n-title="bar.scrubTip">拖光标：浏览</button>
      </span>
      <span class="hint" id="keys" data-i18n="bar.hint" data-i18n-title="bar.hint"></span>
      <span class="right"><button id="bZout" data-i18n-title="bar.zoomOut">－</button><button id="bZin" data-i18n-title="bar.zoomIn">＋</button></span>
    </div>
  </main>

  <aside id="right">
    <div id="tabs"><button data-t="line" class="on" data-i18n="tab.line">行</button><button data-t="style" data-i18n="tab.style">样式</button><button data-t="layout" data-i18n="tab.layout">版面</button><button data-t="export" data-i18n="tab.export">导出</button></div>
    <div id="tab-line" class="tab"></div>
    <div id="tab-style" class="tab" hidden></div>
    <div id="tab-layout" class="tab" hidden></div>
    <div id="tab-export" class="tab" hidden>
      <h4 data-i18n="exp.png">PNG 序列（带透明通道）</h4>
      <div class="row"><label data-i18n="exp.fps">帧率</label><select id="s_fps"><option>24</option><option>25</option><option>30</option><option>50</option><option>60</option></select></div>
      <div class="row"><label data-i18n="exp.range">起止(s)</label><input id="eStart" type="number" step="0.1" value="0" data-i18n-title="exp.start"><input id="eEnd" type="number" step="0.1" data-i18n-title="exp.end"></div>
      <div class="row"><label data-i18n="exp.bg">背景</label><select id="eBg"><option value="transparent" data-i18n="exp.bgNone">透明</option><option value="color" data-i18n="exp.bgColor">纯色背景</option></select></div>
      <div class="btns"><button id="bPng" class="pri" data-i18n="exp.go">导出 PNG 序列到文件夹…</button><button id="bFrame" data-i18n="exp.frame">保存当前帧</button><button id="bCancel" data-i18n="exp.cancel" hidden>取消</button></div>
      <div id="prog"><i></i></div><div class="hint" id="expMsg"></div>
      <div class="hint"><span data-i18n="exp.premiere"></span><br><span data-i18n="exp.prores"></span><br><code>ffmpeg -framerate 60 -i lyrics_%06d.png -c:v prores_ks -profile:v 4444 -pix_fmt yuva444p10le lyrics.mov</code></div>
      <h4 data-i18n="exp.rec">录屏</h4>
      <div class="hint" data-i18n="exp.recHint"></div>
    </div>
  </aside>

  <section id="tl"><canvas id="tlc"></canvas></section>
</div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<input id="fOpen" type="file" hidden>
<video id="media" playsinline hidden></video>

<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/render.js"></script>
<script src="js/ops.js"></script>
<script src="js/stage.js"></script>
<script src="js/timeline.js"></script>
<script src="js/panels.js"></script>
<script>window.K.SAMPLES = [];</script>
<script src="samples/hydro_king_jp.js"></script>
<script src="samples/hydro_king_fr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
